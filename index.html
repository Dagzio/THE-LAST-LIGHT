<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>THE LAST LIGHT</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/graphics/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/graphics/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/graphics/logo.webp" type="image/webp">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body data-screen="splash">
  <!-- Menu backdrop (Canvas 2D) and the map run (three.js WebGL, top-down 3D). Every screen below is a DOM overlay. -->
  <canvas id="world" class="game-canvas"></canvas>
  <canvas id="world3d" class="game-canvas"></canvas>

  <!-- ===== Splash → TAP TO PLAY (H5 §1) ===== -->
  <section class="screen active" id="screen-splash">
    <div class="splash-inner">
      <h1 class="logo fade"><img class="logo-img" src="assets/graphics/logo.webp" width="1200" height="439" alt="THE LAST LIGHT" draggable="false"></h1>
      <div class="load-bar" id="loadBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="loadFill"></i></div>
      <p class="load-pct" id="loadPct">0%</p>
      <p class="tap-prompt" id="tapPrompt" data-i18n="tap.toPlay"></p>
    </div>
  </section>

  <!-- ===== Main menu (decision D5) ===== -->
  <section class="screen" id="screen-menu">
    <div class="menu-logo" aria-hidden="true" data-cheat="maps"><img class="logo-img" src="assets/graphics/logo.webp" width="1200" height="439" alt="" draggable="false"></div>
    <nav class="menu-list">
      <button class="menu-item" data-action="newGame" data-i18n="menu.newGame"></button>
      <button class="menu-item" data-action="openSettings" data-i18n="menu.settings"></button>
      <button class="menu-item" data-action="askReset" data-i18n="game.resetBtn"></button>
    </nav>
    <div class="corner corner-tr">
      <button class="ring-btn" data-action="fullscreen" data-fs data-i18n-aria="aria.fullscreen">
        <svg class="ico ico-fs-enter" viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
        <svg class="ico ico-fs-exit" viewBox="0 0 24 24"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
      </button>
      <!-- D46: credits as an (i) icon; RESET PROGRESS moved into the menu list -->
      <button class="ring-btn" data-action="openCredits" data-i18n-aria="menu.credits">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="0.6" class="fill"/></svg>
      </button>
    </div>
  </section>

  <!-- ===== Map select (Underlords mode-select layout) ===== -->
  <section class="screen" id="screen-mapSelect">
    <div class="corner corner-tl">
      <button class="ring-btn" data-action="backToMenu" data-i18n-aria="aria.back">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
      </button>
    </div>
    <div class="map-layout">
      <!-- Carousel (D45): one card, ◀ ▶, a dot per campaign map (gold = cleared, white = open, dim = locked) -->
      <!-- D46: grid — desktop: ◀ card ▶ (30 px apart) + dots under the card; phones: card on top, ◀ dots ▶ under it -->
      <div class="map-carousel">
        <button class="ring-btn map-arrow map-prev" data-action="mapPrev" data-i18n-aria="aria.prevPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
        </button>
        <div class="map-grid" id="mapGrid"></div>
        <button class="ring-btn map-arrow map-next" data-action="mapNext" data-i18n-aria="aria.nextPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg>
        </button>
        <div class="map-dots" id="mapDots" aria-hidden="true"></div>
      </div>
      <div class="map-side">
        <aside class="panel map-info">
          <h2 class="map-info-name" id="mapName"></h2>
          <p class="map-info-desc" id="mapDesc"></p>
          <ul class="map-info-facts">
            <li id="mapWaves"></li>
            <li id="mapBoss"></li>
            <li id="mapState" class="map-state"></li>
          </ul>
        </aside>
        <button class="brush-btn brush-cta" data-action="beginMap" data-i18n="map.begin"></button>
      </div>
    </div>
  </section>

  <!-- ===== Game scene HUD (Phase 1: system buttons only) ===== -->
  <section class="screen" id="screen-game">
    <!-- D46: no EXIT button on the map — leaving is in the pause menu (EXIT tab) -->
    <div class="corner corner-tl corner-col">
      <button class="ring-btn" data-action="fullscreen" data-fs data-i18n-aria="aria.fullscreen">
        <svg class="ico ico-fs-enter" viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
        <svg class="ico ico-fs-exit" viewBox="0 0 24 24"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
      </button>
    </div>
    <div class="corner corner-tr">
      <!-- Shop (Underlords layout: left of the gear): glows only between waves inside the kiosk radius; coins badge -->
      <button class="ring-btn shop-btn" id="hudShop" data-action="openShop" data-nosfx data-i18n-aria="aria.shop">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L21 7H7"/><circle cx="9.5" cy="19" r="1.6" class="fill"/><circle cx="17" cy="19" r="1.6" class="fill"/></svg>
        <span class="coin-badge" data-cheat="coins"><i class="coin-ico"></i><b id="hudCoins">0</b></span>
      </button>
      <span class="coin-pop" id="coinPop"></span>
      <!-- Grenade slots under the shop (Underlords layout §6.4): tap / 1-2-3 selects a type in stock -->
      <div class="grenade-slots" id="grenadeSlots">
        <button class="gslot" data-action="selectGrenade" data-type="frag" data-nosfx data-i18n-aria="grenade.frag"><i class="gico gico-frag"></i><b>0</b><kbd>1</kbd></button>
        <button class="gslot" data-action="selectGrenade" data-type="cryo" data-nosfx data-i18n-aria="grenade.cryo"><i class="gico gico-cryo"></i><b>0</b><kbd>2</kbd></button>
        <button class="gslot" data-action="selectGrenade" data-type="molotov" data-nosfx data-i18n-aria="grenade.molotov"><i class="gico gico-molotov"></i><b>0</b><kbd>3</kbd></button>
      </div>
      <button class="ring-btn" data-action="openSettings" data-i18n-aria="aria.settings">
        <svg class="ico ico-gear" viewBox="0 0 24 24"><path d="M19.42 10.37L22.13 10.80L22.13 13.20L19.42 13.63L18.40 16.10L20.01 18.31L18.31 20.01L16.10 18.40L13.63 19.42L13.20 22.13L10.80 22.13L10.37 19.42L7.90 18.40L5.69 20.01L3.99 18.31L5.60 16.10L4.58 13.63L1.87 13.20L1.87 10.80L4.58 10.37L5.60 7.90L3.99 5.69L5.69 3.99L7.90 5.60L10.37 4.58L10.80 1.87L13.20 1.87L13.63 4.58L16.10 5.60L18.31 3.99L20.01 5.69L18.40 7.90Z"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>
    </div>
    <!-- Top centre (Underlords round header): beacon Integrity, wave + timer / enemies left, boss bar -->
    <div class="hud-top">
      <div class="hud-beacon" id="hudBeacon">
        <svg class="hud-beacon-ico" viewBox="0 0 24 24"><path d="M9 22l1.5-12h3L15 22zM8.5 8h7l-1-3h-5zM11 2h2v2h-2z"/></svg>
        <i class="hud-beacon-bar"><i id="hudBeaconFill"></i></i>
        <b class="hud-beacon-val" id="hudBeaconVal">0</b>
        <!-- D46: repair to full right here (any time the beacon is damaged); the price is under the wrench -->
        <button class="sq-btn repair-btn" id="hudRepair" data-action="repairBeacon" data-nosfx data-i18n-aria="aria.repair" hidden>
          <svg class="ico" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
          <span class="repair-cost"><b id="hudRepairCost">0</b><i class="coin-ico"></i></span>
        </button>
      </div>
      <div class="hud-wave" id="hudWave">
        <b class="hud-wave-label" id="hudWaveLabel"></b>
        <span class="hud-wave-sub" id="hudWaveSub"></span>
      </div>
      <div class="hud-boss" id="hudBoss" hidden>
        <span class="hud-boss-name" id="hudBossName"></span>
        <i class="hud-boss-bar"><i id="hudBossFill"></i></i>
      </div>
      <!-- touch layout: under the timer (the bottom centre holds the player plate next to the touch buttons) -->
      <button class="brush-btn next-wave-btn next-wave-top" data-action="startNextWave" data-nosfx><span data-i18n="hud.startNextWave"></span><span class="wave-bonus"><b>+25</b><i class="coin-ico"></i></span></button>
      <div class="stamp paused-stamp" data-i18n="hud.paused"></div>
    </div>

    <!-- Wave banner: WAVE N / FINAL WAVE / WAVE CLEARED -->
    <div class="wave-banner" id="waveBanner"><span class="stamp" id="waveBannerText"></span></div>

    <!-- One-time intro card (D45): a new enemy / the map's feature. Never pauses, never takes taps. -->
    <div class="intro-card" id="introCard" aria-live="polite">
      <span class="intro-ico" id="introIco"></span>
      <span class="intro-body">
        <span class="intro-kicker" id="introKicker"></span>
        <b class="intro-title" id="introTitle"></b>
        <span class="intro-text" id="introText"></span>
      </span>
    </div>

    <!-- Bottom centre (desktop), intermission only: START NEXT WAVE (double-press safe in the domain) -->
    <button class="brush-btn next-wave-btn next-wave-bottom" id="btnNextWave" data-action="startNextWave" data-nosfx><span data-i18n="hud.startNextWave"></span><span class="wave-bonus"><b>+25</b><i class="coin-ico"></i></span></button>

    <!-- Map result (Phase 7, D42): the keeper's journal page — lines count up one by one, then the stamp.
         After the last map of the campaign the same page is the Congrats screen (D19). Tap the page to skip. -->
    <div class="result-panel" id="resultPanel">
      <article class="journal" id="journal">
        <p class="journal-kicker" id="jKicker"></p>
        <h2 class="journal-title" id="resultTitle"></h2>
        <p class="journal-sub" id="jSub"></p>
        <ul class="journal-lines" id="jLines"></ul>
        <div class="journal-stamp" id="jStamp"></div>
      </article>
      <div class="result-btns">
        <button class="brush-btn" data-action="continueCampaign" id="resultContinue" data-i18n="result.continue" hidden></button>
        <button class="brush-btn" data-action="retryMap" id="resultRetry"></button>
        <button class="flat-btn" data-action="resultMenu" data-i18n="defeat.menu"></button>
      </div>
    </div>

    <!-- Off-screen indicators: arrows at the screen edge towards enemies, the beacon and (between waves) the kiosk -->
    <div class="offscreen" id="offscreen"></div>

    <!-- Label above the kiosk between waves (positioned from the 3D projection); tap / E opens the shop when in reach -->
    <button class="kiosk-prompt" id="kioskPrompt" data-action="openShop" data-nosfx><span class="kiosk-key">E</span><span data-i18n="hud.shop"></span></button>
    <!-- Crate label: E / tap opens it in reach; countdown until it disappears -->
    <button class="kiosk-prompt crate-prompt" id="cratePrompt" data-action="openCrate" data-nosfx><span class="kiosk-key">E</span><span data-i18n="hud.open"></span><span class="crate-timer" id="crateTimer"></span></button>

    <!-- Bottom-right: weapon block + player plate (Underlords "LOCAL PLAYER" corner) -->
    <div class="hud-player">
      <!-- Emergency Flare (desktop): charge ring, Q or click; the touch version is a neon button above DASH -->
      <button class="flare-hud" data-action="flare" data-nosfx data-i18n-aria="aria.flare">
        <svg class="flare-ring" viewBox="0 0 48 48"><circle class="flare-track" cx="24" cy="24" r="21"/><circle class="flare-fill" cx="24" cy="24" r="21" pathLength="100"/></svg>
        <svg class="ico flare-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6" class="fill"/><path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2M5.3 5.3l2.2 2.2M16.5 16.5l2.2 2.2M5.3 18.7l2.2-2.2M16.5 7.5l2.2-2.2"/></svg>
        <span class="flare-key">Q</span>
      </button>
      <div class="hud-weapon" id="hudWeapon">
        <svg class="hud-gun" viewBox="0 0 48 24"><path d="M4 7h30l2-3h6v6h-4l-2 2H24l-2 9h-7l2-9H4z"/></svg>
        <span class="hud-weapon-name" id="hudWeaponName"></span>
        <span class="hud-ammo"><b id="hudAmmo">0</b><span class="hud-ammo-sep">/</span><span id="hudMag">0</span></span>
        <span class="hud-reload"><span class="hud-reload-label" data-i18n="hud.reloading"></span><i class="hud-reload-bar"><i id="hudReloadFill"></i></i></span>
      </div>
      <div class="hud-plate">
        <span class="hud-name"><span data-i18n="hud.keeper"></span> <span class="hud-lv" id="hudLv"></span></span>
        <span class="hud-hp">
          <svg class="hud-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg>
          <b id="hudHp">100</b>
        </span>
        <i class="hud-hpbar"><i id="hudHpFill"></i></i>
        <i class="hud-xpbar"><i id="hudXpFill"></i></i>
      </div>
    </div>

    <!-- Touch controls (touch devices only, decision D12) -->
    <div class="touch-controls" id="touchControls">
      <div class="touch-stick" id="touchStick"><div class="touch-knob" id="touchKnob"></div></div>
      <div class="touch-actions">
        <div class="touch-col touch-col-left">
          <!-- Grenade: hold + drag to aim (circle + dotted arc), release to throw; tap = straight ahead (D41) -->
          <button class="neon-btn neon-small grenade-neon" id="grenadeBtn" data-nosfx data-i18n-aria="aria.grenade">
            <i class="gico" id="grenadeBtnIco"></i><b class="grenade-count" id="grenadeBtnCount">0</b>
          </button>
          <button class="neon-btn neon-small" data-touch-action="reload" data-nosfx data-i18n-aria="aria.reload">
            <svg class="ico" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 3.5V8h-4.5"/><path d="M11 9h2v6h-2z" class="fill"/></svg>
          </button>
        </div>
        <div class="touch-col">
          <button class="neon-btn neon-small flare-neon" data-touch-action="flare" data-nosfx data-i18n-aria="aria.flare">
            <svg class="flare-ring" viewBox="0 0 48 48"><circle class="flare-track" cx="24" cy="24" r="21"/><circle class="flare-fill" cx="24" cy="24" r="21" pathLength="100"/></svg>
            <svg class="ico flare-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6" class="fill"/><path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2M5.3 5.3l2.2 2.2M16.5 16.5l2.2 2.2M5.3 18.7l2.2-2.2M16.5 7.5l2.2-2.2"/></svg>
          </button>
          <button class="neon-btn dash-neon" data-touch-action="dash" data-nosfx data-i18n-aria="aria.dash">
            <!-- cooldown: the button dims and the ring fills (like the FLARE charge ring) -->
            <svg class="flare-ring dash-ring" viewBox="0 0 48 48"><circle class="flare-track" cx="24" cy="24" r="21"/><circle class="dash-fill" cx="24" cy="24" r="21" pathLength="100"/></svg>
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7"/><path d="M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Shop (Phase 5, Underlords shop style). Before Settings in the DOM: pausing from the shop shows Settings on top ===== -->
  <div class="popup popup-shop" id="popup-shop" role="dialog" aria-modal="true">
    <div class="panel shop-panel">
      <div class="tabs-row">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-shop-tab="weapons" data-i18n="shop.tab.weapons"></button>
          <button class="tab" role="tab" data-shop-tab="weaponUpgrades" data-i18n="shop.tab.weaponUpgrades"></button>
          <button class="tab" role="tab" data-shop-tab="playerUpgrades" data-i18n="shop.tab.playerUpgrades"></button>
          <button class="tab" role="tab" data-shop-tab="grenades" data-i18n="shop.tab.grenades"></button>
          <button class="tab" role="tab" data-shop-tab="defenses" data-i18n="shop.tab.defenses"></button>
        </div>
        <span class="shop-coins" data-cheat="coins"><i class="coin-ico"></i><b id="shopCoins">0</b></span>
        <button class="ring-btn ring-close" data-action="closeShop" data-i18n-aria="aria.close">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="shop-bar">
        <span class="shop-level" id="shopLevel"></span>
        <i class="shop-xp"><i id="shopXpFill"></i></i>
        <span class="shop-coins" data-cheat="coins"><i class="coin-ico"></i><b id="shopCoinsBar">0</b></span>
        <span class="shop-timer" id="shopTimer"></span>
        <button class="brush-btn shop-start" data-action="startNextWave" data-nosfx><span data-i18n="hud.startNextWave"></span><span class="wave-bonus"><b>+25</b><i class="coin-ico"></i></span></button>
      </div>
      <div class="shop-sub" id="shopSub"></div>
      <!-- Phones: one row of cards, paged with the arrows (no scrolling, 05-MOBILE-POLISH §1); desktop: a grid -->
      <div class="shop-pager">
        <button class="ring-btn shop-page" id="shopPrev" data-nosfx data-i18n-aria="aria.prevPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
        </button>
        <div class="shop-grid" id="shopGrid"></div>
        <button class="ring-btn shop-page" id="shopNext" data-nosfx data-i18n-aria="aria.nextPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Crate reward (Underlords "CHOOSE A BOON"): 3 cards, the world is frozen until one is chosen ===== -->
  <div class="popup popup-crate" id="popup-crate" role="dialog" aria-modal="true">
    <div class="crate-panel">
      <h2 class="stamp crate-title" data-i18n="crate.title"></h2>
      <div class="crate-cards" id="crateCards"></div>
    </div>
  </div>

  <!-- ===== Tutorial hint (D11 / D43): spotlight on the target, arrow, hint card (no narrator). Above the shop,
       below Settings / confirmation popups. Closes only with its own buttons. ===== -->
  <div class="tutorial" id="tutorial" hidden>
    <div class="tut-spot" id="tutSpot"></div>
    <div class="tut-arrow" id="tutArrow"><svg viewBox="0 0 24 24"><path d="M12 3v14M5 11l7 8 7-8"/></svg></div>
    <div class="tut-card" id="tutCard" role="dialog" aria-modal="true">
      <span class="tut-ico" id="tutIco"></span>
      <p class="tut-text" id="tutText"></p>
      <div class="tut-btns">
        <button class="flat-btn tut-skip" data-action="skipTutorial" data-i18n="tut.skip"></button>
        <button class="brush-btn tut-ok" data-action="tutorialOk" data-i18n="tut.ok"></button>
      </div>
    </div>
  </div>

  <!-- Save notice (damaged save restored / reset) -->
  <div class="toast" id="toast" role="status"></div>

  <!-- ===== Settings (= pause in the game scene) ===== -->
  <div class="popup" id="popup-settings" role="dialog" aria-modal="true">
    <div class="panel settings-panel">
      <div class="tabs-row">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="game" data-i18n="tab.game"></button>
          <button class="tab" role="tab" data-tab="video" data-i18n="tab.video"></button>
          <button class="tab" role="tab" data-tab="audio" data-i18n="tab.audio"></button>
          <button class="tab" role="tab" data-tab="language" data-i18n="tab.language"></button>
          <button class="tab" role="tab" data-tab="exit" data-i18n="tab.exit" hidden></button>
        </div>
        <button class="ring-btn ring-close" data-action="closeSettings" data-i18n-aria="aria.close">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="tab-body">
        <section class="tab-page" data-page="game">
          <h3 class="section-title" data-i18n="game.progress"></h3>
          <p class="hint" data-i18n="game.resetHint"></p>
          <button class="flat-btn danger" data-action="askReset" data-i18n="game.resetBtn"></button>
        </section>
        <section class="tab-page" data-page="video">
          <h3 class="section-title" data-i18n="video.quality"></h3>
          <!-- D46: Automatic + Fullscreen share one row (the page fits a 300 px high phone) -->
          <div class="check-pair">
            <button class="check-row" role="switch" id="qualityAuto"><span class="check"></span><span data-i18n="video.auto"></span></button>
            <button class="check-row" role="switch" id="toggleFullscreen"><span class="check"></span><span data-i18n="video.fullscreen"></span></button>
          </div>
          <div class="qslider" id="qualitySlider" role="slider" aria-valuemin="0" aria-valuemax="2">
            <div class="qslider-track"><div class="qslider-fill"></div></div>
            <span class="qslider-notch n0"></span>
            <span class="qslider-notch n1"></span>
            <span class="qslider-notch n2"></span>
            <div class="qslider-thumb"></div>
          </div>
          <div class="qslider-labels">
            <span data-i18n="video.fastest"></span>
            <span class="qslider-value" id="qualityName"></span>
            <span data-i18n="video.best"></span>
          </div>
        </section>
        <section class="tab-page" data-page="audio">
          <h3 class="section-title" data-i18n="audio.header"></h3>
          <button class="check-row" role="switch" id="toggleSound"><span class="check"></span><span data-i18n="audio.sound"></span></button>
          <button class="check-row" role="switch" id="toggleMusic"><span class="check"></span><span data-i18n="audio.music"></span></button>
        </section>
        <section class="tab-page" data-page="language">
          <h3 class="section-title" data-i18n="tab.language"></h3>
          <div class="lang-grid" id="langGrid"></div>
        </section>
        <!-- D46: pause only — leave the map (asks for confirmation, then map select) -->
        <section class="tab-page" data-page="exit">
          <h3 class="section-title" data-i18n="exit.title"></h3>
          <p class="hint" data-i18n="exit.hint"></p>
          <button class="flat-btn danger" data-action="askExit" data-i18n="exit.btn"></button>
        </section>
      </div>
    </div>
  </div>

  <!-- ===== Credits (H5 §6.3: publisher logo + close only) ===== -->
  <div class="popup" id="popup-credits" role="dialog" aria-modal="true">
    <div class="panel credits-panel">
      <button class="ring-btn ring-close" data-action="closeCredits" data-i18n-aria="aria.close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <img class="credits-logo" src="assets/ui/qplaze-logo.png" alt="" draggable="false">
    </div>
  </div>

  <!-- ===== Confirmation: YES left, NO right (H5 §4) ===== -->
  <div class="popup popup-confirm" id="popup-confirm" role="alertdialog" aria-modal="true">
    <div class="panel confirm-panel">
      <p class="confirm-text" id="confirmText"></p>
      <div class="confirm-btns">
        <button class="brush-btn confirm-yes" id="confirmYes" data-i18n="common.yes"></button>
        <button class="flat-btn confirm-no" id="confirmNo" data-i18n="common.no"></button>
      </div>
    </div>
  </div>

  <!-- ===== Rotate your phone (H5 §13): image only ===== -->
  <div id="orientation-blocker"><img src="assets/ui/Orientation.png" alt="" draggable="false"></div>

  <div id="debugOverlay" hidden></div>

  <script type="module" src="src/boot.js"></script>
</body>
</html>
