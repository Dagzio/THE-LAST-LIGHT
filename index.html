<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>ORPHEUS: GHOST INDEX</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/graphics/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/graphics/apple-touch-icon.png">
  <link rel="preload" as="image" href="assets/graphics/logo.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/graphics/splash.webp" type="image/webp">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body data-screen="splash">
  <!-- Menu input surface (Canvas 2D) and the map run (three.js WebGL, top-down 3D). Every screen below is a DOM overlay. -->
  <canvas id="world" class="game-canvas"></canvas>
  <canvas id="world3d" class="game-canvas"></canvas>
  <!-- D81: the user's main-menu picture (main menu + level select), instead of the 3D flyover -->
  <img class="menu-bg" id="menuBg" src="assets/graphics/menu.webp" width="1672" height="941" alt="" draggable="false">

  <!-- ===== Splash → TAP TO PLAY (H5 §1) ===== -->
  <section class="screen active" id="screen-splash">
    <!-- D64: the user's splash art (cover); the logo column sits between the lamp and the moon, above the ground -->
    <!-- D69: the picture always fills the screen (cover, anchored at the top — on screens wider than 16:9 the bottom goes) -->
    <img class="splash-bg fade" id="splashBg" src="assets/graphics/splash.webp" width="1672" height="941" alt="" draggable="false">
    <div class="splash-inner" id="splashInner">
      <h1 class="logo fade"><img class="logo-img" src="assets/graphics/logo.webp" width="1200" height="424" alt="ORPHEUS: GHOST INDEX" draggable="false"></h1>
    </div>
    <!-- D65: the loading bar low in the centre (the user's reference); TAP TO PLAY takes its place when loading ends -->
    <div class="splash-bottom">
      <div class="load-bar" id="loadBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="load-track"><i id="loadFill"></i></span></div>
      <p class="load-pct" id="loadPct">0%</p>
      <p class="tap-prompt" id="tapPrompt" data-i18n="tap.toPlay"></p>
    </div>
  </section>

  <!-- ===== Main menu (decision D5) ===== -->
  <section class="screen" id="screen-menu">
    <div class="menu-logo" aria-hidden="true" data-cheat="maps"><img class="logo-img" src="assets/graphics/logo.webp" width="1200" height="424" alt="" draggable="false"></div>
    <nav class="menu-list">
      <button class="menu-item" data-action="newGame" data-i18n="menu.newGame"></button>
      <button class="menu-item" data-action="openSettings" data-i18n="menu.settings"></button>
      <button class="menu-item" data-action="askReset" data-i18n="game.resetBtn"></button>
    </nav>
    <div class="corner corner-tr">
      <button class="ring-btn" data-action="fullscreen" data-fs data-i18n-aria="aria.fullscreen">
        <svg class="ico ico-fs-enter" viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
        <svg class="ico ico-fs-exit" viewBox="0 0 24 24"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
      </button>
      <!-- D46: credits as an (i) icon; RESET PROGRESS moved into the menu list -->
      <button class="ring-btn" data-action="openCredits" data-i18n-aria="menu.credits">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="0.6" class="fill"/></svg>
      </button>
    </div>
  </section>

  <!-- ===== Map select (Underlords mode-select layout) ===== -->
  <section class="screen" id="screen-mapSelect">
    <div class="corner corner-tl">
      <button class="ring-btn" data-action="backToMenu" data-i18n-aria="aria.back">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
      </button>
    </div>
    <div class="map-layout">
      <!-- Carousel (D45): one card, ◀ ▶, a dot per campaign map (gold = cleared, white = open, dim = locked) -->
      <!-- D46: grid — desktop: ◀ card ▶ (30 px apart) + dots under the card; phones: card on top, ◀ dots ▶ under it -->
      <div class="map-carousel">
        <button class="ring-btn map-arrow map-prev" data-action="mapPrev" data-i18n-aria="aria.prevPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
        </button>
        <div class="map-grid" id="mapGrid"></div>
        <button class="ring-btn map-arrow map-next" data-action="mapNext" data-i18n-aria="aria.nextPage">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg>
        </button>
        <div class="map-dots" id="mapDots" aria-hidden="true"></div>
      </div>
      <div class="map-side">
        <!-- D85: the level's modes — mission / stealth / survival -->
        <div class="mode-tabs" id="modeTabs" role="tablist" data-i18n-aria="aria.mode">
          <button class="mode-tab" role="tab" data-action="selectMode" data-mode="mission"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span data-i18n="mode.mission.name"></span></button>
          <button class="mode-tab" role="tab" data-action="selectMode" data-mode="stealth"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg><span data-i18n="mode.stealth.name"></span></button>
          <button class="mode-tab" role="tab" data-action="selectMode" data-mode="survival"><svg class="ico" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/></svg><span data-i18n="mode.survival.name"></span></button>
        </div>
        <aside class="panel map-info">
          <h2 class="map-info-name" id="mapName"></h2>
          <p class="map-info-desc" id="mapDesc"></p>
          <ul class="map-info-facts">
            <li id="mapWaves"></li>
            <li id="mapBoss" hidden></li>
            <li id="mapState" class="map-state"></li>
          </ul>
        </aside>
        <button class="brush-btn brush-cta" data-action="beginMap" data-i18n="map.begin"></button>
      </div>
    </div>
  </section>

  <!-- ===== Level HUD (KILL LIST D78) ===== -->
  <section class="screen" id="screen-game">
    <!-- D46: no EXIT button on the level — leaving is in the pause menu (EXIT tab) -->
    <div class="corner corner-tl corner-col">
      <button class="ring-btn" data-action="fullscreen" data-fs data-i18n-aria="aria.fullscreen">
        <svg class="ico ico-fs-enter" viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
        <svg class="ico ico-fs-exit" viewBox="0 0 24 24"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
      </button>
    </div>
    <div class="corner corner-tr">
      <button class="ring-btn" data-action="openSettings" data-i18n-aria="aria.settings">
        <svg class="ico ico-gear" viewBox="0 0 24 24"><path d="M19.42 10.37L22.13 10.80L22.13 13.20L19.42 13.63L18.40 16.10L20.01 18.31L18.31 20.01L16.10 18.40L13.63 19.42L13.20 22.13L10.80 22.13L10.37 19.42L7.90 18.40L5.69 20.01L3.99 18.31L5.60 16.10L4.58 13.63L1.87 13.20L1.87 10.80L4.58 10.37L5.60 7.90L3.99 5.69L5.69 3.99L7.90 5.60L10.37 4.58L10.80 1.87L13.20 1.87L13.63 4.58L16.10 5.60L18.31 3.99L20.01 5.69L18.40 7.90Z"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>
    </div>
    <!-- Top centre: the current objective of the level -->
    <div class="hud-top">
      <div class="hud-objective" id="hudObjective">
        <span class="hud-obj-kicker" id="hudObjKicker"></span>
        <b class="hud-obj-text" id="hudObjText"></b>
      </div>
      <!-- D85 stealth: the alert scale (calm → suspicion → search → alarm) and how visible the hero is -->
      <div class="stealth-hud" id="stealthHud">
        <span class="alert-pips" id="alertPips"><i></i><i></i><i></i><i></i></span>
        <b class="alert-label" id="alertLabel"></b>
        <span class="vis-label" id="visLabel"><svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg><span id="visText"></span></span>
      </div>
      <div class="stamp paused-stamp" data-i18n="hud.paused"></div>
    </div>

    <!-- Event banner: KEY CARD / DOOR UNLOCKED / REINFORCEMENTS ... -->
    <div class="wave-banner" id="waveBanner"><span class="stamp" id="waveBannerText"></span></div>

    <!-- Phone call card (briefing at the start, the turn after the drive). Never pauses, never takes taps. -->
    <div class="intro-card call-card" id="introCard" aria-live="polite">
      <span class="intro-ico" id="introIco"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg></span>
      <span class="intro-body">
        <span class="intro-kicker" id="introKicker"></span>
        <b class="intro-title" id="introTitle"></b>
        <span class="intro-text" id="introText"></span>
      </span>
    </div>

    <!-- D88: dialogue (the handler / the hero): portrait + the user's frame, the text typed letter by letter; the game
         waits meanwhile. NEXT finishes the line / goes on, SKIP closes the whole dialogue. -->
    <!-- D93: the level's loading screen (the level's art, name, mode, a progress bar) until the run starts -->
    <div class="level-loading" id="levelLoading" hidden>
      <img class="ll-bg" id="llBg" alt="" draggable="false">
      <div class="ll-panel">
        <b class="ll-name" id="llName"></b>
        <span class="ll-mode" id="llMode"></span>
        <div class="load-bar ll-bar"><span class="load-track"><i id="llFill"></i></span></div>
        <span class="ll-text" id="llText"></span>
      </div>
    </div>
    <div class="dlg" id="dialogue" hidden>
      <img class="dlg-portrait" id="dlgPortrait" alt="" draggable="false">
      <div class="dlg-box">
        <i class="dlg-frame"></i>
        <b class="dlg-name" id="dlgName"></b>
        <p class="dlg-text" id="dlgText"></p>
        <span class="dlg-btns">
          <button class="dlg-btn dlg-skip" id="dlgSkip" data-nosfx data-i18n="dlg.skip"></button>
          <button class="dlg-btn dlg-next" id="dlgNext" data-nosfx data-i18n="dlg.next"></button>
        </span>
      </div>
    </div>

    <!-- Level result. D110 (user): a field tablet — it boots with a glitch, the lines count up one by one, then the status
         lands. Tap the screen to skip. -->
    <div class="result-panel" id="resultPanel">
      <article class="journal tablet" id="journal">
        <div class="tab-screen">
          <div class="tab-bar">
            <span class="tab-rec"></span>
            <p class="journal-kicker" id="jKicker"></p>
            <span class="tab-sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="tab-bat" aria-hidden="true"><i></i></span>
          </div>
          <h2 class="journal-title" id="resultTitle"></h2>
          <p class="journal-sub" id="jSub"></p>
          <ul class="journal-lines" id="jLines"></ul>
          <div class="journal-stamp" id="jStamp"></div>
        </div>
      </article>
      <div class="result-btns">
        <button class="brush-btn" data-action="continueCampaign" id="resultContinue" data-i18n="result.continue" hidden></button>
        <button class="brush-btn" data-action="retryMap" id="resultRetry"></button>
        <button class="flat-btn" data-action="resultMenu" data-i18n="defeat.menu"></button>
      </div>
    </div>

    <!-- Arrow at the screen edge towards the current objective while it is off screen -->
    <div class="offscreen" id="offscreen"><span class="obj-arrow" id="objArrow"><svg viewBox="0 0 24 24"><path d="M4 12h13M12 5l7 7-7 7"/></svg></span><span class="obj-arrow alt" id="objArrow2"><svg viewBox="0 0 24 24"><path d="M4 12h13M12 5l7 7-7 7"/></svg></span></div>

    <!-- Above the crate in reach: E / tap opens it -->
    <button class="kiosk-prompt crate-prompt" id="cratePrompt" data-action="interact" data-nosfx><span class="kiosk-key">E</span><span id="cratePromptText" data-i18n="hud.open"></span></button>
    <!-- D85 stealth: over the enemy one can take down (F) / over the server terminal (hold E) -->
    <div class="kiosk-prompt crate-prompt ctx-prompt" id="ctxPrompt"><span class="kiosk-key" id="ctxKey">F</span><span id="ctxText"></span></div>
    <!-- D83: next to an object one can hide behind (PC): Q / click takes cover -->
    <button class="kiosk-prompt crate-prompt cover-prompt" id="coverPrompt" data-action="toggleCover" data-nosfx><span class="kiosk-key">Q</span><span data-i18n="hud.cover"></span></button>

    <!-- Bottom-right: action bar + weapon block (tap = next weapon) + HP plate -->
    <div class="hud-player">
      <div class="hud-actions" id="hudActions">
        <button class="act-btn act-dash" data-hold-action="dash" data-nosfx data-i18n-aria="aria.dash">
          <svg class="flare-ring dash-ring" viewBox="0 0 48 48"><circle class="flare-track" cx="24" cy="24" r="21"/><circle class="dash-fill" cx="24" cy="24" r="21" pathLength="100"/></svg>
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7"/><path d="M12 5l7 7-7 7"/></svg>
          <kbd class="act-key act-key-wide">SPACE</kbd>
        </button>
        <button class="act-btn act-grenade" id="hudGrenade" data-action="armGrenade" data-nosfx data-i18n-aria="aria.grenade">
          <i class="gico gico-frag" id="hudGrenadeIco"></i><b class="grenade-count" id="hudGrenadeCount">0</b>
          <kbd class="act-key">G</kbd>
        </button>
      </div>
      <button class="hud-weapon" id="hudWeapon" data-action="switchWeapon" data-nosfx data-i18n-aria="aria.switchWeapon">
        <img class="hud-gun" id="hudGun" src="assets/ui/guns/pistol.webp" alt="" draggable="false">
        <span class="hud-weapon-name" id="hudWeaponName"></span>
        <span class="hud-ammo"><b id="hudAmmo">0</b><span class="hud-ammo-sep">/</span><span id="hudMag">0</span></span>
        <span class="hud-reload"><span class="hud-reload-label" data-i18n="hud.reloading"></span><i class="hud-reload-bar"><i id="hudReloadFill"></i></i></span>
        <span class="hud-slots" id="hudSlots"></span>
      </button>
      <div class="hud-plate">
        <span class="hud-name"><span class="hud-lv" id="hudLevelName"></span></span>
        <span class="hud-hp">
          <svg class="hud-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg>
          <b id="hudHp">100</b>
        </span>
        <i class="hud-hpbar"><i id="hudHpFill"></i></i>
        <span class="hud-items" id="hudItems"></span>
      </div>
    </div>

    <!-- Touch controls (touch devices only, decision D12) -->
    <div class="touch-controls" id="touchControls">
      <div class="touch-stick" id="touchStick"><div class="touch-knob" id="touchKnob"></div></div>
      <!-- D93: the trigger zone (the right part of the screen) — shown only when a lesson lights it up -->
      <div class="touch-fire-zone" id="touchFireZone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg></div>
      <div class="touch-actions">
        <div class="touch-col touch-col-left">
          <button class="neon-btn neon-small grenade-neon" id="grenadeBtn" data-action="armGrenade" data-nosfx data-i18n-aria="aria.grenade">
            <i class="gico gico-frag" id="grenadeBtnIco"></i><b class="grenade-count" id="grenadeBtnCount">0</b>
          </button>
          <button class="neon-btn neon-small" data-touch-action="reload" data-nosfx data-i18n-aria="aria.reload">
            <svg class="ico" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 3.5V8h-4.5"/><path d="M11 9h2v6h-2z" class="fill"/></svg>
          </button>
        </div>
        <div class="touch-col">
          <!-- D85: a hold source (the stealth copy is held; a tap still opens a crate / starts a takedown) -->
          <button class="neon-btn neon-small interact-neon" id="interactBtn" data-touch-action="interact" data-nosfx data-i18n-aria="aria.interact">
            <svg class="ico" viewBox="0 0 24 24"><path d="M4 9h16v10H4z"/><path d="M4 9l2-4h12l2 4M10 13h4"/></svg>
          </button>
          <!-- D83: cover — shows next to an object one can hide behind; lit while in cover (tap again leaves it) -->
          <button class="neon-btn neon-small cover-neon" id="coverBtn" data-action="toggleCover" data-nosfx data-i18n-aria="aria.cover">
            <!-- D109 (user: a clearer icon): a man crouched behind a brick wall, his hand on it -->
            <svg class="ico ico-cover" viewBox="0 0 24 24">
              <rect class="fill" x="12.6" y="12" width="9.6" height="9" rx="0.8"/>
              <path class="seam" d="M12.6 15h9.6M12.6 18h9.6M16.4 12v3M20 12v3M14.6 15v3M18.2 15v3M16.4 18v3M20 18v3"/>
              <circle class="fill" cx="9.7" cy="9.6" r="2.3"/>
              <path class="limb" d="M9.2 12.8L6.4 16.6L9.9 18L9.4 20.6M6.4 16.6L5.6 20.6H3.4M8.9 14L11.1 15"/>
            </svg>
          </button>
          <button class="neon-btn dash-neon" data-touch-action="dash" data-nosfx data-i18n-aria="aria.dash">
            <svg class="flare-ring dash-ring" viewBox="0 0 48 48"><circle class="flare-track" cx="24" cy="24" r="21"/><circle class="dash-fill" cx="24" cy="24" r="21" pathLength="100"/></svg>
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7"/><path d="M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Save notice (damaged save restored / reset) -->
  <div class="toast" id="toast" role="status"></div>

  <!-- ===== Settings (= pause in the game scene) ===== -->
  <div class="popup" id="popup-settings" role="dialog" aria-modal="true">
    <div class="panel settings-panel">
      <div class="tabs-row">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="game" data-i18n="tab.game"></button>
          <button class="tab" role="tab" data-tab="video" data-i18n="tab.video"></button>
          <button class="tab" role="tab" data-tab="audio" data-i18n="tab.audio"></button>
          <button class="tab" role="tab" data-tab="language" data-i18n="tab.language"></button>
          <button class="tab" role="tab" data-tab="exit" data-i18n="tab.exit" hidden></button>
        </div>
        <button class="ring-btn ring-close" data-action="closeSettings" data-i18n-aria="aria.close">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="tab-body">
        <section class="tab-page" data-page="game">
          <h3 class="section-title" data-i18n="game.progress"></h3>
          <p class="hint" data-i18n="game.resetHint"></p>
          <button class="flat-btn danger" data-action="askReset" data-i18n="game.resetBtn"></button>
        </section>
        <section class="tab-page" data-page="video">
          <h3 class="section-title" data-i18n="video.quality"></h3>
          <!-- D46: Automatic + Fullscreen share one row (the page fits a 300 px high phone) -->
          <div class="check-pair">
            <button class="check-row" role="switch" id="qualityAuto"><span class="check"></span><span data-i18n="video.auto"></span></button>
            <button class="check-row" role="switch" id="toggleFullscreen"><span class="check"></span><span data-i18n="video.fullscreen"></span></button>
          </div>
          <div class="qslider" id="qualitySlider" role="slider" aria-valuemin="0" aria-valuemax="2">
            <div class="qslider-track"><div class="qslider-fill"></div></div>
            <span class="qslider-notch n0"></span>
            <span class="qslider-notch n1"></span>
            <span class="qslider-notch n2"></span>
            <div class="qslider-thumb"></div>
          </div>
          <div class="qslider-labels">
            <span data-i18n="video.fastest"></span>
            <span class="qslider-value" id="qualityName"></span>
            <span data-i18n="video.best"></span>
          </div>
        </section>
        <section class="tab-page" data-page="audio">
          <h3 class="section-title" data-i18n="audio.header"></h3>
          <button class="check-row" role="switch" id="toggleSound"><span class="check"></span><span data-i18n="audio.sound"></span></button>
          <button class="check-row" role="switch" id="toggleMusic"><span class="check"></span><span data-i18n="audio.music"></span></button>
        </section>
        <section class="tab-page" data-page="language">
          <h3 class="section-title" data-i18n="tab.language"></h3>
          <div class="lang-grid" id="langGrid"></div>
        </section>
        <!-- D46: pause only — leave the map (asks for confirmation, then map select) -->
        <section class="tab-page" data-page="exit">
          <h3 class="section-title" data-i18n="exit.title"></h3>
          <p class="hint" data-i18n="exit.hint"></p>
          <button class="flat-btn danger" data-action="askExit" data-i18n="exit.btn"></button>
        </section>
      </div>
    </div>
  </div>

  <!-- ===== Credits (H5 §6.3: publisher logo + close only) ===== -->
  <div class="popup" id="popup-credits" role="dialog" aria-modal="true">
    <div class="panel credits-panel">
      <button class="ring-btn ring-close" data-action="closeCredits" data-i18n-aria="aria.close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <img class="credits-logo" src="assets/ui/qplaze-logo.png" alt="" draggable="false">
    </div>
  </div>

  <!-- ===== Confirmation: YES left, NO right (H5 §4) ===== -->
  <div class="popup popup-confirm" id="popup-confirm" role="alertdialog" aria-modal="true">
    <div class="panel confirm-panel">
      <p class="confirm-text" id="confirmText"></p>
      <div class="confirm-btns">
        <button class="brush-btn confirm-yes" id="confirmYes" data-i18n="common.yes"></button>
        <button class="flat-btn confirm-no" id="confirmNo" data-i18n="common.no"></button>
      </div>
    </div>
  </div>

  <!-- ===== Rotate your phone (H5 §13): image only ===== -->
  <div id="orientation-blocker"><img src="assets/ui/Orientation.png" alt="" draggable="false"></div>

  <div id="debugOverlay" hidden></div>

  <script type="module" src="src/boot.js"></script>
</body>
</html>
